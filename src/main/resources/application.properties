# ============================================
# APPLICATION
# ============================================
spring.application.name=ecommerce-backend
spring.profiles.active=dev
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================
# JPA (common)
# ============================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# JWT (shared ? override in prod via env)
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============ Telegram ============
telegram.bot-token=${TELEGRAM_BOT_TOKE}
telegram.chat-id=${TELEGRAM_CHAT_ID}


# ============ ABA PayWay ============
payway.merchant-id=${PAYWAY_MERCHANT_ID}
payway.api-key=${PAYWAY_API_KEY}
payway.sandbox-url=https://checkout-sandbox.payway.com.kh
payway.production-url=https://checkout.payway.com.kh
payway.sandbox-mode=true

# ============ Bakong KHQR ============
bakong.account-id=${BAKONG_ACCOUNT_ID:yourname@aclb}
bakong.merchant-name=${BAKONG_MERCHANT_NAME:ShopHub}
bakong.merchant-city=${BAKONG_MERCHANT_CITY:Phnom Penh}
# Token is required to check if the user actually paid
bakong.api-token=${BAKONG_API_TOKEN:your_bakong_api_token_here}
bakong.api-url=https://api-bakong.nbc.gov.kh/v1
#khqr.api-token=rbk_enwdt3Rnb2feGRdZzUttnbraE87i5SFD
khqr.api-token=${KHQR_API_TOKEN}


spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---- Frontend URL (used in email link) ----
#app.frontend.url=http://localhost:5173
app.frontend.url=http://192.168.1.12:5173

# ---- Mail sender (must match spring.mail.username for Gmail) ----
app.mail.from=${MAIL_USERNAME}

# ---- SMTP ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

# ============================================
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.currency=${STRIPE_CURRENCY:usd}

# ============================================
# CORS
# ============================================
#cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
#cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
#cors.allowed-headers=*
#cors.exposed-headers=Authorization,Content-Type,X-Total-Count
#cors.allow-credentials=true
#cors.max-age=3600

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173, http://127.0.0.1:5173}
#cors.allowed-origins=http://localhost:5173,http://192.168.1.12:5173
#cors.allowed-origins=http://localhost:5173,http://172.20.10.3:5173
#cors.allowed-origins=http://localhost:5173,http://192.168.1.138:5173
#cors.allowed-origins=http://localhost:5173,http://192.168.1.138:5173,http://127.0.0.1:5173



cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,Cache-Control,X-XSRF-TOKEN
cors.exposed-headers=Authorization,Content-Type,Content-Disposition,X-Total-Count
cors.allow-credentials=true
cors.max-age=3600


# ============================================
# FILE UPLOAD
# ============================================
file.upload-dir=${FILE_UPLOAD_DIR:uploads/}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.ecommerce=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

logging.level.org.hibernate=WARN
logging.file.name=logs/ecommerce-backend.log
logging.file.max-size=10MB
logging.file.max-history=30

# ============ Google OAuth ============
google.client.id=${GOOGLE_CLIENT_ID}
logging.level.org.apache.tomcat.util.http.parser.Cookie=ERROR


# ============================================
# JACKSON
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ============================================
# ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized


# ============================================
# ERROR HANDLING
# ============================================
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ============================================
# SWAGGER
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs