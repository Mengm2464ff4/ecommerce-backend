# ============================================
# TEST PROFILE CONFIGURATION (H2 In-Memory)
# ? DO NOT add spring.profiles.active here!
# ============================================

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (optional - for debugging tests)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=test-secret-key-for-testing-purposes-only-must-be-at-least-64-characters-long-abcdefghij
jwt.expiration=3600000
jwt.refresh-expiration=7200000

# Stripe (dummy values for testing)
stripe.api.key=sk_test_dummy
stripe.webhook.secret=whsec_dummy
stripe.currency=usd

# CORS
cors.allowed-origins=http://localhost:3000

# File Upload
file.upload-dir=target/test-uploads/

# Logging
logging.level.root=WARN
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.hibernate.SQL=DEBUG